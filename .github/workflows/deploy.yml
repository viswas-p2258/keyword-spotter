name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: keyword-spotting-app
  IMAGE_TAG: ${{ github.sha }}
  AWS_ROLE_TO_ASSUME: arn:aws:iam::696073197777:role/KWS-GitHub-Deploy
  EC2_NAME: keyword-spotting-app

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
            --tag "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Deploy to EC2 and verify health
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          mapfile -t instance_ids < <(
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=${EC2_NAME}" \
                "Name=tag:Project,Values=keyword-spotter" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n'
          )
          if [[ "${#instance_ids[@]}" -ne 1 || -z "${instance_ids[0]}" ]]; then
            echo "::error::Expected exactly one running EC2 instance tagged ${EC2_NAME}; found ${#instance_ids[@]}."
            exit 1
          fi
          instance_id="${instance_ids[0]}"

          ssm_status=""
          for attempt in $(seq 1 60); do
            ssm_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${instance_id}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [[ "$ssm_status" == "Online" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$ssm_status" != "Online" ]]; then
            echo "::error::EC2 instance ${instance_id} did not register as an online SSM managed instance."
            exit 1
          fi

          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          deploy_script="set -eu
          aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'
          docker pull '${image}'
          docker rm --force kws-app >/dev/null 2>&1 || true
          docker run --detach --name kws-app --restart unless-stopped --publish 80:5000 '${image}'
          for attempt in \$(seq 1 30); do
            if curl --fail --silent http://127.0.0.1/health; then exit 0; fi
            sleep 2
          done
          docker logs kws-app
          exit 1"
          parameters=$(jq -n --arg command "$deploy_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 120); do
            invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --output json 2>/dev/null || true)
            status=$(jq -r '.Status // empty' <<<"$invocation")
            if [[ "$status" == "Success" ]]; then
              jq -r '.StandardOutputContent' <<<"$invocation"
              break
            fi
            if [[ "$status" == "Failed" || "$status" == "TimedOut" || "$status" == "Cancelled" ]]; then
              jq -r '.StandardErrorContent, .StandardOutputContent' <<<"$invocation"
              echo "::error::SSM deployment command ended with ${status}."
              exit 1
            fi
            sleep 5
          done
          if [[ "$status" != "Success" ]]; then
            echo "::error::Timed out waiting for SSM deployment command ${command_id}."
            exit 1
          fi

      - name: Verify public health endpoint
        id: deployment-url
        run: |
          set -euo pipefail
          ec2_ip=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${EC2_NAME}" \
              "Name=tag:Project,Values=keyword-spotter" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PublicIpAddress' \
            --output text)
          if [[ -z "$ec2_ip" || "$ec2_ip" == "None" ]]; then
            echo "::error::The tagged EC2 instance has no public IPv4 address."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://${ec2_ip}/health"; then
              echo
              echo "Live application: http://${ec2_ip}/"
              echo "Health endpoint: http://${ec2_ip}/health"
              echo "public_ip=${ec2_ip}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deployed application's public /health endpoint did not return HTTP 2xx."
          exit 1

      - name: Verify live keyword inference
        env:
          EC2_PUBLIC_IP: ${{ steps.deployment-url.outputs.public_ip }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --form "file=@dataset/test/audio2.wav;type=audio/wav" \
            "http://${EC2_PUBLIC_IP}/transcribe" \
            --output inference.html
          grep -q "Transcribed keyword:" inference.html
          grep -q "Predicted probability:" inference.html
          sed -n 's/.*Transcribed keyword: \([^<]*\).*/Predicted keyword: \1/p' inference.html
          sed -n 's/.*Predicted probability: \([^<]*\).*/Confidence: \1/p' inference.html
